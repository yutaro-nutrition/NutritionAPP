name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recipe_test_db
          POSTGRES_USER: recipe_test_user
          POSTGRES_PASSWORD: recipe_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipe_test_user -d recipe_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: recipe_test_db
      TEST_POSTGRES_USER: recipe_test_user
      TEST_POSTGRES_PASSWORD: recipe_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: recipe_test_db
      POSTGRES_USER: recipe_test_user
      POSTGRES_PASSWORD: recipe_test_password
      APP_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app_api/requirements_api.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r app_api/requirements_api.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run verification
        shell: pwsh
        run: ./scripts/run_mvp_verification.ps1 -SkipPostgresStartup

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
