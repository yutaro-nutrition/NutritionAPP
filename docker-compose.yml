version: "3.9"

services:
  postgres_test:
    image: postgres:16
    container_name: recipe-postgres-test
    environment:
      POSTGRES_DB: recipe_test_db
      POSTGRES_USER: recipe_test_user
      POSTGRES_PASSWORD: recipe_test_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_test_user -d recipe_test_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
